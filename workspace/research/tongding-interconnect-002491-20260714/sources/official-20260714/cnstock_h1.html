    })();</script><script>function checkDeviceAndRedirect() {
      let lsearch = new URLSearchParams(window.location.search);
      let sign = lsearch.get("sign");
      let timestamp = lsearch.get("timestamp");
      let filterList = ['/finance', '/reading']
      let isFilter = filterList.some(item => location.href.indexOf(item) !== -1)

      // 如果有 sign 和 timestamp 参数，不进行跳转
      if ((sign && timestamp)) return;
      
      var uA = navigator.userAgent.toLowerCase();
      var currentHost = location.host;
      
      // 判断是否为移动设备（与 www 端保持一致，包含 ipad）
      var isMobile = /ipad|iphone|ipod|android|harmonyos|openharmony|midp|rv:1\.2\.3\.4|ucweb|windows ce|windows mobile/i.test(uA);
      
      // 判断当前是否在 wap/m 域名
      var isWapDomain = /wap|^m-|^m\./i.test(currentHost);
      
      // PC 端访问 wap 域名时，跳转到 www 域名
      if (!isMobile && isWapDomain && !isFilter) {
        var assets = ''
        var pathname = location.pathname;
        var search = window.location.search
        var fullUrl = window.location.href;
        if (fullUrl.indexOf('m-dev') !== -1) {
          assets = '-dev';
        } else if (fullUrl.indexOf('m-test') !== -1) {
          assets = '-test';
        } else if (fullUrl.indexOf('m-pre') !== -1) {
          assets = '-pre';
        }
        window.location.href = `https://${currentHost.indexOf('wap') !== -1 ? 'node' : 'www'}` + assets + '.cnstock.com' + pathname + search;
      }
      // 移动端保持在当前页面，或者非 wap 域名不跳转
    }

    // PC 端自动跳转到 www 域名
    checkDeviceAndRedirect();
