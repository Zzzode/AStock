    </div>
    
    <div class="cinfo center">

    <div class="ccontent center" id="con_con" style="font-size:14px;font-family:'宋体';">
        <p style="text-align: left; text-indent: 2em;">2025年1—12月，我国造船完工量5369万载重吨，同比增长11.4%，占世界总量的56.1%；新接订单量10782万载重吨，同比下降4.6%，占世界总量的<strong style="font-weight: 400;display: inline-block;text-indent: 0em;">69.0%；</strong>截至12月底，手持订单量27442万载重吨，同比增长31.5%，占世界总量的66.8%。我国造船三大指标国际市场份额连续16年保持全球领先。</p>
